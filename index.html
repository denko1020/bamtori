<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뱀토리 — 3D 모형</title>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<style>
  :root { --ink:#3a1f2b; --sub:#7a5a66; --line:#f0d6df; --bg:#ffffff; --panel:#fff8fa; --accent:#f0679a; --yel:#ffd93b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:24px; flex-wrap:wrap; padding:12px 20px; border-bottom:3px solid var(--yel); background:var(--accent); }
  .ttl { font-size:22px; font-weight:800; color:#fff; }
  .ttl span { font-size:14px; font-weight:500; color:#ffe3ee; margin-left:10px; }
  main { flex:1; display:flex; min-height:0; }
  #view { position:relative; flex:1; min-width:0; overflow:hidden;
    background:radial-gradient(ellipse at 50% 38%, #e8f5ff 0%, #a9d6fb 48%, #5fa5ea 100%); }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ov, #lb { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #tools { position:absolute; left:16px; top:14px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; max-width:calc(100% - 32px);
    background:rgba(255,255,255,.94); padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  #tools .grp { font-size:12px; color:var(--sub); font-weight:700; margin:0 2px 0 6px; flex:0 0 auto; }
  #tools button { font:inherit; font-size:13px; padding:5px 12px; border:1.5px solid var(--ink); background:#fff; color:var(--ink); border-radius:4px; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  #tools button.on { background:var(--ink); color:#fff; }
  #tools button.act.on { background:var(--accent); border-color:#c2416f; color:#fff; }
  #tools button.ex.on { background:#ffd93b; border-color:#b8860b; color:var(--ink); font-weight:700; }
  #tools label { font-size:13px; margin-left:8px; display:flex; align-items:center; gap:6px; white-space:nowrap; flex:0 0 auto; }
  #tools input[type=range] { width:104px; }
  .hint { pointer-events:none; position:absolute; left:16px; bottom:12px; font-size:12px; color:#1d4f86; }
  .lbl { position:absolute; background:#fff; border:1.5px solid var(--ink); border-radius:4px; padding:3px 8px; white-space:nowrap; font-size:12px; font-weight:600; transform:translate(-50%,-50%); }
  aside { width:366px; flex:none; background:var(--panel); border-left:1px solid var(--line); padding:16px 18px; overflow-y:auto; }
  aside h2 { margin:0 0 4px; font-size:19px; }
  .comp { font-size:13px; color:var(--sub); margin:0 0 12px; line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { padding:6px 5px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--sub); font-weight:600; background:#fbe8ef; }
  tr.part { cursor:pointer; } tr.part:hover td { background:#fbe8ef; }
  tr.part.on td { background:#ffd6e5; font-weight:600; }
  .sw { display:inline-block; width:11px; height:11px; border:1px solid #c9a7b4; border-radius:2px; vertical-align:-1px; margin-right:5px; }
  .beat { margin:12px 0; padding:9px 11px; background:#fff3c9; border-left:3px solid #e0b100; font-size:12.5px; line-height:1.6; }
  .foot { margin-top:14px; font-size:11.5px; color:var(--sub); line-height:1.6; }
  @media (max-width: 860px) {
    header { padding:10px 14px; gap:10px; }
    .ttl { font-size:18px; }
    .ttl span { display:block; margin:2px 0 0; font-size:12px; }
    main { flex-direction:column; }
    #view { flex:none; height:min(72vh, 640px); min-height:320px; }
    aside { width:100%; flex:none; border-left:none; border-top:1px solid var(--line); padding:14px 16px; overflow-y:visible; }
    #tools { left:8px; right:8px; top:8px; max-width:none; padding:6px 8px; gap:4px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    #tools button { padding:4px 9px; font-size:12px; }
    #tools label { font-size:12px; margin-left:5px; }
    #tools input[type=range] { width:80px; }
    .hint { display:none; }
  }
</style>
</head>
<body>
<header>
  <div class="ttl">뱀토리<span>3D 모형 · 끌어서 돌리기</span></div>
</header>
<main>
  <div id="view">
    <canvas id="c"></canvas>
    <svg id="ov"></svg>
    <div id="lb"></div>
    <div id="tools"></div>
    <div class="hint">끌기 = 돌리기 · 휠 = 확대 · 오른쪽 끌기 = 옮기기</div>
  </div>
  <aside id="side"></aside>
</main>
<script>
/* ===== 공통 헬퍼 ===== */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const RAD = Math.PI / 180;
function mat(hex, o) {
  o = o || {};
  const m = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(hex).convertSRGBToLinear(),
    roughness: o.roughness === undefined ? 0.55 : o.roughness,
    metalness: o.metalness === undefined ? 0 : o.metalness,
    clearcoat: o.coat || 0, clearcoatRoughness: 0.3,
    side: o.side || THREE.FrontSide,
  });
  if (o.opacity !== undefined) { m.transparent = true; m.opacity = o.opacity; }
  if (o.emissive !== undefined) { m.emissive = new THREE.Color(o.emissive).convertSRGBToLinear(); m.emissiveIntensity = o.ei || 1; }
  if (o.map) m.map = o.map;
  return m;
}
function ellip(rx, ry, rz, m, seg) {
  const g = new THREE.SphereGeometry(1, seg || 40, Math.round((seg || 40) / 2));
  g.scale(rx, ry, rz);
  return new THREE.Mesh(g, m);
}
function cyl(rTop, rBot, h, m, seg, open) { return new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg || 28, 1, !!open), m); }
function tubeOf(pts, r, m, seg) { return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg || 40, r, 12), m); }
function lathe(loop, m, seg) { return new THREE.Mesh(new THREE.LatheGeometry(loop.map(p => new THREE.Vector2(p[0], p[1])), seg || 40), m); }
function tag(o, key) { o.traverse(x => { if (x.isMesh) { x.castShadow = true; x.receiveShadow = true; x.userData.part = key; } }); return o; }
function alignY(obj, dir) { obj.quaternion.setFromUnitVectors(V3(0, 1, 0), dir.clone().normalize()); return obj; }
function marker(parent, p) { const o = new THREE.Object3D(); o.position.copy(p); parent.add(o); return o; }
/* 매개 곡면 — fn(u, v) 가 점을 돌려준다 (머리카락 장막 · 옆머리 가닥) */
function paramSurface(fn, nu, nv, m) {
  const pos = [], idx = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) { const p = fn(i / nu, j / nv); pos.push(p.x, p.y, p.z); }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, m);
}

/* ===== 색 — 첨부 그림에서 뽑은 값 ===== */
const C = {
  skin: 0xfbdcc6, blush: 0xf6a0a6, hatch: 0xe9707f, hair: 0x2e1d17, hairHi: 0x4a3226,
  ink: 0x2a1812, iris: 0x7a4a2a, pupil: 0x2a1610, white: 0xffffff,
  mouth: 0xa32f45, tongue: 0xf27a86, teeth: 0xfffaf2,
  knit: 0xf4e7cf, knitDk: 0xe4d2b3, skirt: 0x34406a, sock: 0xfbfbf8, shoe: 0x7a4a2e,
  candyA: 0xff7aa8, candyB: 0xfff3f7, stick: 0xffffff,
  golden: 0xdb9a45, goldenLt: 0xf0c27c, goldenDk: 0xbf7e30,
  corgi: 0xfffcf6, corgiBeige: 0xf1e1c6,
  stage: 0xf6b3c8, stageTop: 0xfff3d6, bulbA: 0xffe37a, bulbB: 0xff9fc2,
};
const M = {
  skin: mat(C.skin, { roughness: 0.5, coat: 0.15 }),
  blush: mat(C.blush, { roughness: 0.7, side: THREE.DoubleSide }),
  hatch: mat(C.hatch, { roughness: 0.7 }),
  hair: mat(C.hair, { roughness: 0.5, coat: 0.35, side: THREE.DoubleSide }),
  hairHi: mat(C.hairHi, { roughness: 0.5 }),
  ink: mat(C.ink, { roughness: 0.5 }),
  iris: mat(C.iris, { roughness: 0.25, coat: 1, side: THREE.DoubleSide }),
  pupil: mat(C.pupil, { roughness: 0.25, coat: 1, side: THREE.DoubleSide }),
  white: mat(C.white, { roughness: 0.3, side: THREE.DoubleSide }),
  mouth: mat(C.mouth, { roughness: 0.7, side: THREE.DoubleSide }),
  tongue: mat(C.tongue, { roughness: 0.5, side: THREE.DoubleSide }),
  teeth: mat(C.teeth, { roughness: 0.35, side: THREE.DoubleSide }),
  knitDk: mat(C.knitDk, { roughness: 0.95 }),
  skirt: mat(C.skirt, { roughness: 0.8, side: THREE.DoubleSide }),
  sock: mat(C.sock, { roughness: 0.85 }),
  shoe: mat(C.shoe, { roughness: 0.35, coat: 0.6 }),
  stick: mat(C.stick, { roughness: 0.6 }),
  golden: mat(C.golden, { roughness: 0.8 }), goldenLt: mat(C.goldenLt, { roughness: 0.85 }), goldenDk: mat(C.goldenDk, { roughness: 0.8 }),
  corgi: mat(C.corgi, { roughness: 0.85 }), corgiBeige: mat(C.corgiBeige, { roughness: 0.85 }),
  dogNose: mat(0x1d1714, { roughness: 0.3, coat: 0.8 }), dogEye: mat(0x241913, { roughness: 0.15, coat: 1 }),
  dogPink: mat(0xf58b98, { roughness: 0.5, side: THREE.DoubleSide }),
  stage: mat(C.stage, { roughness: 0.6 }),
  stageTop: mat(C.stageTop, { roughness: 0.4, coat: 0.6 }),
  bulbA: mat(C.bulbA, { emissive: C.bulbA, ei: 1.0, roughness: 0.3 }),
  bulbB: mat(C.bulbB, { emissive: C.bulbB, ei: 1.0, roughness: 0.3 }),
};
/* 니트 결 — 세로 골지 */
function knitTexture() {
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const x = cv.getContext('2d');
  x.fillStyle = '#f4e7cf'; x.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 4; i++) {
    const g = x.createLinearGradient(i * 16, 0, i * 16 + 16, 0);
    g.addColorStop(0, 'rgba(190,165,125,0.35)'); g.addColorStop(0.5, 'rgba(255,255,255,0.15)'); g.addColorStop(1, 'rgba(190,165,125,0.35)');
    x.fillStyle = g; x.fillRect(i * 16, 0, 16, 64);
  }
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const KNIT_TEX = knitTexture();
function knitMat(rep) { const t = KNIT_TEX.clone(); t.needsUpdate = true; t.repeat.set(rep, 1); return mat(C.knit, { roughness: 0.92, map: t }); }
M.knit = knitMat(14); M.knitSleeve = knitMat(8);

/* ===== 치수 — 하치와레 모형과 같은 비율 (머리 가로 66 · 몸통 가로 36, mm 꼴) =====
   얼굴 부품은 머리 가로 44 짜리 틀에 그린 뒤 1.5 배로 키운다 → 실제 머리 66 × 56 × 60
   바닥 기준: 무대 윗면 8 · 엉덩이 22 · 몸통 중심 36 · 어깨 41 · 머리 중심 68 · 정수리 96 */
const STAGE_H = 8, STAGE_R = 44;
const HEAD_S = 1.5;      // 머리 배율 1.00 — 하치와레 머리 그대로 (66 × 56 × 60)
const BODY_S = 0.65;     // 몸 배율 0.65 — 몸통·팔·다리 (발바닥은 무대 위에 그대로)
const ALL_S = 0.85;      // 비율은 그대로 두고 캐릭터 전체 크기만 조금 줄인다
const HEAD = { rx: 22, ry: 18.73, rz: 20 };
const BODY = { rx: 18, ry: 14.5, rz: 15, cy: 12 };
const HIP_Y = 22;

function surf(X, Y, out) {
  const k = Math.max(0.02, 1 - (X / HEAD.rx) ** 2 - (Y / HEAD.ry) ** 2);
  const Z = HEAD.rz * Math.sqrt(k);
  const n = V3(X / HEAD.rx ** 2, Y / HEAD.ry ** 2, Z / HEAD.rz ** 2).normalize();
  return { p: V3(X + n.x * out, Y + n.y * out, Z + n.z * out), n };
}
function onHead(u, t, out) {
  out = out || 0;
  const st = Math.sin(t), ct = Math.cos(t);
  return V3((HEAD.rx + out) * st * Math.sin(u), (HEAD.ry + out) * ct, (HEAD.rz + out) * st * Math.cos(u));
}
function patch(fn, nu, nv, m, out) {
  const g = new THREE.BufferGeometry(), idx = [];
  const n = (nu + 1) * (nv + 1);
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  g.setIndex(idx);
  const mesh = new THREE.Mesh(g, m);
  mesh.userData.refresh = (k) => {
    const pa = g.attributes.position, na = g.attributes.normal;
    for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
      const q = fn(i / nu, j / nv, k), r = surf(q[0], q[1], out), id = j * (nu + 1) + i;
      pa.setXYZ(id, r.p.x, r.p.y, r.p.z); na.setXYZ(id, r.n.x, r.n.y, r.n.z);
    }
    pa.needsUpdate = true; na.needsUpdate = true; g.computeBoundingSphere();
  };
  mesh.userData.refresh(1);
  return mesh;
}
function ovalPatch(cx, cy, rx, ry, m, out) {
  return patch((u, v) => [cx + rx * v * Math.cos(u * Math.PI * 2), cy + ry * v * Math.sin(u * Math.PI * 2)], 36, 6, m, out);
}
function faceLine(pts, r, m, out) { return tubeOf(pts.map(q => surf(q[0], q[1], out).p), r, m, 24); }
function faceDot(X, Y, r, m, out) { const d = ellip(r, r, r * 0.45, m, 12); const s = surf(X, Y, out); d.position.copy(s.p); d.lookAt(s.p.clone().add(s.n)); return d; }
const ANCH = {};

/* ===== 무대 ===== */
function buildStage() {
  const g = new THREE.Group();
  const side = cyl(STAGE_R, STAGE_R + 1.5, STAGE_H, M.stage, 72); side.position.y = STAGE_H / 2; g.add(side);
  const top = new THREE.Mesh(new THREE.CircleGeometry(STAGE_R - 0.2, 72), M.stageTop);
  top.rotation.x = -Math.PI / 2; top.position.y = STAGE_H + 0.05; g.add(top);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(STAGE_R - 0.4, 0.7, 8, 96), M.bulbB);
  rim.rotation.x = Math.PI / 2; rim.position.y = STAGE_H; g.add(rim);
  for (let k = 0; k < 30; k++) {
    const a = k / 30 * Math.PI * 2;
    const b = ellip(1.3, 1.3, 1.3, k % 2 ? M.bulbA : M.bulbB, 14);
    b.position.set(Math.sin(a) * (STAGE_R + 1.0), STAGE_H * 0.5, Math.cos(a) * (STAGE_R + 1.0));
    g.add(b);
  }
  ANCH.stage = marker(g, V3(STAGE_R * 0.7, 4, STAGE_R * 0.7));
  return tag(g, 'stage');
}

/* ===== 다리 — 짧고 뭉툭하게, 흰 양말 · 갈색 구두 ===== */
function buildLeg(side) {
  const g = new THREE.Group(); g.position.set(side * 6.2, HIP_Y, 0);
  const leg = cyl(3.3, 3.0, 9, M.skin, 20); leg.position.y = -4; g.add(leg);
  const sock = cyl(3.45, 3.35, 3.6, M.sock, 20); sock.position.y = -8.6; g.add(sock);
  const cuff = new THREE.Mesh(new THREE.TorusGeometry(3.4, 0.6, 8, 24), M.sock); cuff.rotation.x = Math.PI / 2; cuff.position.y = -6.9; g.add(cuff);
  const shoe = new THREE.Group(); shoe.position.set(0, -11.3, 1.6);
  const up = ellip(4.0, 2.8, 6.4, M.shoe); up.position.y = 0.4; shoe.add(up);
  const sole = ellip(4.2, 0.9, 6.6, mat(0x3a2418, { roughness: 0.6 })); sole.position.y = -1.6; shoe.add(sole);
  const strap = new THREE.Mesh(new THREE.TorusGeometry(3.3, 0.45, 6, 24, Math.PI), M.shoe);
  strap.position.set(0, 2.2, 0.6); shoe.add(strap);
  g.add(shoe);
  tag(g, 'legs');
  if (side > 0) ANCH.legs = marker(g, V3(2, -11, 6));
  return g;
}
/* 치마 — 남색 주름치마가 니트 아래로 살짝 보인다 */
function buildSkirt() {
  const geo = new THREE.CylinderGeometry(15.2, 18.6, 6.5, 48, 2, true), pa = geo.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    const x = pa.getX(i), z = pa.getZ(i), a = Math.atan2(x, z);
    const f = 1 + 0.045 * Math.abs(Math.sin(a * 12));   // 주름
    pa.setX(i, x * f); pa.setZ(i, z * f);
  }
  geo.computeVertexNormals();
  const s = new THREE.Mesh(geo, M.skirt); s.position.y = HIP_Y - 2.2;
  const g = new THREE.Group(); g.add(s);
  ANCH.skirt = marker(g, V3(-14, HIP_Y - 3, 9));
  return tag(g, 'skirt');
}

/* ===== 몸통 — 크림색 오버핏 니트 ===== */
function buildTorso(t) {
  const g = new THREE.Group();
  const b = ellip(BODY.rx, BODY.ry, BODY.rz, M.knit, 48); b.position.y = BODY.cy; g.add(b);
  const hem = lathe([[15.0, 4], [16.6, 0.6], [16.9, -1.0]], mat(C.knit, { roughness: 0.92, side: THREE.DoubleSide, map: M.knit.map }), 48); g.add(hem);
  const rib = new THREE.Mesh(new THREE.TorusGeometry(16.6, 1.15, 8, 64), M.knitDk); rib.rotation.x = Math.PI / 2; rib.position.y = -1.0; g.add(rib);
  ANCH.knit = marker(g, V3(13, 8, 9));
  t.add(tag(g, 'knit'));
}

/* ===== 팔 — 소매가 손등까지 덮는 니트 소매 ===== */
const ARM = {};
function sleeveArm(path, key) {
  const g = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(path);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 36, 4.1, 14), M.knitSleeve));
  g.add(ellip(5.2, 5.2, 5.2, M.knitSleeve));
  const end = path[path.length - 1], tan = curve.getTangentAt(1);
  const cuff = new THREE.Mesh(new THREE.TorusGeometry(4.0, 1.25, 8, 28), M.knitDk);
  cuff.position.copy(end); cuff.lookAt(end.clone().add(tan)); g.add(cuff);
  const hp = end.clone().add(tan.clone().multiplyScalar(2.6));
  const hand = ellip(3.4, 3.2, 3.2, M.skin); hand.position.copy(hp); g.add(hand);
  tag(g, key);
  return { g, hp, tan, curve };
}
function buildArmV() {   // 왼손 (+x) — 볼 옆 브이
  const root = new THREE.Group(); root.position.set(16, 17, 1);
  const { g, hp } = sleeveArm([V3(0, 0, 0), V3(3, 1, 5), V3(5, 2.5, 11), V3(6.2, 4, 20), V3(6.5, 5, 28)], 'armV');
  [-1, 1].forEach(s => {
    const f = new THREE.Group();
    const c = cyl(1.05, 1.15, 5.2, M.skin, 12); c.position.y = 2.6; f.add(c);
    const tip = ellip(1.05, 1.05, 1.05, M.skin, 12); tip.position.y = 5.2; f.add(tip);
    f.position.copy(hp).add(V3(s * 1.3, 2.4, 0.4)); f.rotation.z = -s * 14 * RAD - 0.25; f.rotation.x = -0.2;
    g.add(tag(f, 'armV'));
  });
  const thumb = ellip(1.2, 2.0, 1.2, M.skin, 12); thumb.position.copy(hp).add(V3(-2.2, 0.6, 2.0)); thumb.rotation.z = -0.8; g.add(tag(thumb, 'armV'));
  root.add(g);
  ANCH.armV = marker(g, V3(7, 6, 7));
  return root;
}
function candyTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const x = cv.getContext('2d'); x.translate(128, 128);
  x.fillStyle = '#fff3f7'; x.beginPath(); x.arc(0, 0, 128, 0, Math.PI * 2); x.fill();
  x.strokeStyle = '#ff6fa0'; x.lineWidth = 22; x.lineCap = 'round'; x.beginPath();
  for (let a = 0; a < Math.PI * 2 * 3.2; a += 0.05) { const r = 6 + a * 6; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  x.stroke();

function iconTexture(kind, color) {

  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; return t;
}
function bubbleTexture(text, kind, fill, ink) {
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 200;
  const x = cv.getContext('2d'); x.translate(160, 98);
  x.beginPath();
  if (kind === 'round') { x.ellipse(0, -6, 120, 66, 0, 0, Math.PI * 2); x.moveTo(-30, 50); x.lineTo(-56, 90); x.lineTo(-2, 58); }
  else if (kind === 'spike') { for (let i = 0; i < 24; i++) { const r = i % 2 ? 60 : 90, a = i * Math.PI / 12; x.lineTo(Math.cos(a) * r * 1.5, Math.sin(a) * r); } x.closePath(); }
  if (kind !== 'plain') { x.fillStyle = fill; x.fill(); x.lineWidth = 6; x.strokeStyle = '#3a1f2b'; x.stroke(); }
  x.fillStyle = ink || '#3a1f2b'; x.font = '900 64px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  if (kind === 'plain') { x.lineWidth = 10; x.strokeStyle = '#ffffff'; x.strokeText(text, 0, 0); }
  x.fillText(text, 0, kind === 'round' ? -4 : 2);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; return t;
}
const TEX = {};
function tex(key, make) { return TEX[key] || (TEX[key] = make()); }
const fx = [];
function spawnSprite(map, pos, o) {

}
function spawnHeart() {
  const a = Math.random() * Math.PI * 2, r = 28 + Math.random() * 12;
  const kind = Math.random() < 0.6 ? 'heart' : 'star';

/* 막대사탕 맞추기 — 할짝 자세(LICK_RX)에서 사탕이 입꼬리 옆 바로 앞에 오고, 사탕 면은 앞을 보게 한다 */
const REST_RX = 0.62, LICK_RX = 0.3;
function fitLollipop(b) {
  b.armL.rotation.set(LICK_RX, 0, 0);
  b.dancer.updateMatrixWorld(true);
  const target = surf(-6.2, -8.2, 0).p, n = surf(-6.2, -8.2, 0).n;
  target.add(n.clone().multiplyScalar(2.2));
  b.head.localToWorld(target);
  const lol = ARM.lol;
  const T = lol.worldToLocal(target.clone());
  const len = T.length(), dir = T.clone().normalize();
  ARM.stick.scale.y = len - 3; ARM.stick.position.copy(dir.clone().multiplyScalar((len - 3) / 2)); alignY(ARM.stick, dir);
  ARM.candy.position.copy(T);
  // 앞(+z 월드) 방향을 막대에 수직이 되게 맞춘 면
  const fwdW = lol.localToWorld(T.clone()).add(V3(0, 0, 1));
  const fwd = lol.worldToLocal(fwdW).sub(T).normalize();
  const nrm = fwd.sub(dir.clone().multiplyScalar(fwd.dot(dir))).normalize();
  ARM.candy.lookAt(lol.localToWorld(T.clone().add(nrm)));
  b.armL.rotation.set(REST_RX, 0, 0);
}

        o.userData.dm = Array.isArray(o.userData.om) ? o.userData.om.map(mk) : mk(o.userData.om);

function camDist(half, halfW) {
  const t = Math.tan(camera.fov * RAD / 2);

}
function setView(k) {

    iso: { t: V3(0, 40, 0), half: 46, w: 58, dir: V3(0.5, 0.3, 1).normalize() },
    front: { t: V3(0, 40, 0), half: 44, w: 56, dir: V3(0, 0.08, 1).normalize() },

    top: { t: V3(0, 30, 0), half: 56, w: 56, dir: V3(0, 1, 0.001).normalize() },
  }[k];
  camera.position.copy(v.t.clone().add(v.dir.clone().multiplyScalar(camDist(v.half, v.w))));
  controls.target.copy(v.t); controls.update();
  S.view = k;

     <b>에오</b> — 누르면 고개를 갸웃하며 "에오" 말풍선.<br><b>표정</b> — 귀여운(윙크) · 놀란 · 졸린. 졸리면 고개가 꾸벅이고 Z 가 떠오르며, 가끔 하품한다.</div>
     <table><thead><tr><th>부품</th><th>읽은 것</th><th>크기 (mm)</th></tr></thead><tbody>${rows}</tbody></table>
     <p class="foot">얼굴·머리·니트는 첨부 그림에서, 머리·몸통 비율은 하치와레 3D 모형 기준 머리 1.00 · 몸 0.65 이고, 전체 크기는 0.85 배. 그림은 가슴 위까지라 치마·다리·구두는 니트에 어울리게 지어 넣었다. 그림 속 소품(버블티·토끼)은 빼고, 대신 막대사탕과 강아지 둘을 두었다.</p>`;
  document.querySelectorAll('tr.part').forEach(tr => tr.onclick = () => {
    S.sel = S.sel === tr.dataset.k ? null : tr.dataset.k;
    applySel(); panel();
  });
}

/* ===== 움직임 ===== */
let eoT = 0;
let last = performance.now(), beatAcc = 0, beatN = 0, phase = 0, mouthK = -1, twirl = -1, yawnT = 0, nextYawn = 6;
const smooth = t => t * t * (3 - 2 * t);
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now(), dt = Math.min((now - last) / 1000, 0.05); last = now;
  const b = built, bps = S.bpm / 60, tt = now / 1000;
  if (S.play) phase += dt * bps * (S.expr === 'sleepy' ? 0.6 : 1);
  const p = phase * Math.PI * 2, on = S.play ? 1 : 0;
  const sleepy = S.expr === 'sleepy' ? 1 : 0, amp = sleepy ? 0.45 : 1;
  let mouthWant = 0.75, lift = 0;

  // 기본 자세로 되돌린 뒤 동작별로 더한다
  ['legL', 'legR', 'torso', 'neck', 'armV', 'armL'].forEach(k => b[k].rotation.set(0, 0, 0));
  b.bob.position.y = 0;
  b.armL.rotation.x = REST_RX;                    // 사탕 팔 — 기본은 가슴 앞
  if (S.act === 'dance') {
    const hop = Math.abs(Math.sin(p / 2 * 2));
    b.bob.position.y = on * amp * hop * 2.4;
    b.legL.rotation.x = -on * amp * Math.max(0, Math.sin(p)) * 0.4;
    b.legR.rotation.x = -on * amp * Math.max(0, -Math.sin(p)) * 0.4;
    b.torso.rotation.z = on * amp * Math.sin(p / 2) * 0.09;
    b.torso.rotation.y = on * amp * Math.sin(p / 2) * 0.12;
    b.neck.rotation.z = -on * amp * Math.sin(p / 2 + 0.3) * 0.16;
    b.neck.rotation.x = on * amp * Math.sin(p) * 0.04;
    b.armV.rotation.z = on * amp * Math.sin(p / 2) * 0.28;
    b.armV.rotation.y = -on * amp * Math.sin(p) * 0.12;
    b.armL.rotation.x = REST_RX + on * amp * Math.sin(p / 2 + 1) * 0.2;
    b.armL.rotation.z = -on * amp * Math.sin(p / 2) * 0.22;
    mouthWant = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(p));
  } else {
    // 막대사탕 — 두 박마다 입으로 가져가 할짝
    const c = (phase / 2) % 1;
    lift = on ? (c < 0.35 ? smooth(c / 0.35) : c < 0.7 ? 1 : 1 - smooth((c - 0.7) / 0.3)) : 0.3;
    const lick = c > 0.35 && c < 0.7 ? Math.sin((c - 0.35) / 0.35 * Math.PI * 3) : 0;
    b.armL.rotation.x = REST_RX - lift * (REST_RX - LICK_RX) + lick * 0.03;
    
    b.bob.position.y = on * amp * Math.abs(Math.sin(p / 2)) * 0.9;
    b.torso.rotation.z = on * amp * Math.sin(p / 4) * 0.06;
    b.neck.rotation.z = (0.12 * lift + on * amp * Math.sin(p / 4) * 0.05);
    b.neck.rotation.y = -0.1 * lift;
    b.neck.rotation.x = 0.05 * lift + lick * 0.02;
    b.armV.rotation.z = on * amp * Math.sin(p / 2) * 0.1;
    b.legL.rotation.x = -on * amp * Math.max(0, Math.sin(p / 2)) * 0.25;
    mouthWant = 0.35 + lift * 0.45 + Math.abs(lick) * 0.15;
  }
  // 졸림 — 꾸벅꾸벅, 가끔 하품
  if (sleepy) {
    b.neck.rotation.x += 0.12 + Math.max(0, Math.sin(tt * 1.3)) * 0.14;
    b.neck.rotation.z += Math.sin(tt * 0.7) * 0.06;
    mouthWant = 0.05;
    nextYawn -= dt;
    if (nextYawn <= 0 && yawnT <= 0) { yawnT = 2.2; nextYawn = 7 + Math.random() * 4; }
    if (yawnT > 0) { const y = 1 - yawnT / 2.2; mouthWant = Math.sin(y * Math.PI); b.neck.rotation.x -= 0.2 * Math.sin(y * Math.PI); yawnT -= dt; }
  }
  if (S.expr === 'surprise') { mouthWant = 0.6 + 0.4 * Math.abs(Math.sin(tt * 2)); }
  // 에오 — 고개를 갸웃하며 "에" (입 옆으로) 했다가 "오" (입 동그랗게)
  if (eoT > 0) {
    const e = 1.3 - eoT;
    b.neck.rotation.z += 0.2 * Math.sin(Math.min(1, e / 0.3) * Math.PI / 2) * (eoT > 0.25 ? 1 : eoT / 0.25);
    mouthWant = e < 0.55 ? 0.45 : 1.0;
    b.bob.position.y += e < 0.55 ? 0 : 1.2 * Math.sin((e - 0.55) / 0.75 * Math.PI);
    eoT = Math.max(0, eoT - dt);
  }
  // 입 맞추기
  if (Math.abs(mouthWant - mouthK) > 0.01) { mouthK = mouthWant; mouthSets[S.expr].parts.forEach(m => m.userData.refresh(mouthK)); }

  // 빙글 — 춤일 때 열여섯 박마다 한 바퀴 콩
  if (S.spin) b.dancer.rotation.y += dt * 0.6;
  else if (S.act === 'dance' && on) {
    const c = phase % 16;
    b.dancer.rotation.y = c > 15 ? smooth(c - 15) * Math.PI * 2 : 0;
  } else b.dancer.rotation.y *= 0.9;

  // 강아지
  const G = b.golden.userData, K = b.corgi.userData;
  G.tail.rotation.z = Math.sin(tt * 9) * 0.5;
  G.head.rotation.z = Math.sin(p / 2) * 0.18;
  G.head.rotation.x = Math.sin(p) * 0.05;
  K.hind.rotation.z = Math.sin(p * 2) * 0.22;
  K.hind.position.x = Math.sin(p * 2) * 0.6;
  K.head.rotation.z = Math.sin(p / 2 + 1) * 0.16;
  K.head.rotation.y = Math.sin(p / 4) * 0.15;
  K.ears.forEach((e, i) => e.rotation.x = Math.max(0, Math.sin(tt * 2.3 + i * 2)) ** 8 * 0.4);
  // 전구
  const blink = Math.sin(p) > 0;
  M.bulbA.emissiveIntensity = blink ? 1.3 : 0.25; M.bulbB.emissiveIntensity = blink ? 0.25 : 1.3;

  // 박자마다
  if (S.play) {
    beatAcc += dt * bps;
    if (beatAcc >= 1) {
      beatAcc -= 1; beatN++;
      if (S.fx) {
        if (sleepy) { if (beatN % 2 === 0) spawnSprite(tex('z', () => bubbleTexture('Z', 'plain', '', '#5b7fd6')), V3(15 + Math.random() * 5, 72, 12), { s: 7 + Math.random() * 4, ratio: 0.625, life: 2.4, vy: 0.1 }); }
        else if (S.act === 'lolli') { if (beatN % 6 === 0) spawnBubble('냠', 'round', '#ffffff', V3(-26, 68, 18), 17); if (beatN % 2) spawnHeart(); }
        else { spawnHeart(); if (beatN % 2) spawnHeart(); }
        if (S.expr === 'surprise' && beatN % 8 === 0) spawnBubble('!!', 'spike', '#ffe56b', V3(26, 76, 18), 17);
      }
    }
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const n = fx[i], u = n.userData; u.t += dt;
    const f = u.t / u.life;
    const s = u.pop ? u.s * Math.min(1, u.t / 0.16) : u.s * Math.sin(Math.min(1, f) * Math.PI);
    n.scale.set(s, s * u.ratio, 1);
    n.material.rotation += u.spin * dt;
    n.position.y += u.vy;
    n.material.opacity = Math.max(0, f < 0.7 ? 1 : 1 - (f - 0.7) / 0.3);
    if (u.t > u.life) { scene.remove(n); fx.splice(i, 1); }
  }
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
}

init();
</script>
</body>
</html>
